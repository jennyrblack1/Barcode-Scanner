<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>What Did You Find?</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f7f7f5;color:#171717}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
#status{font-size:clamp(30px,5vw,58px);font-weight:850;margin:8px 0 18px}
#picture{display:none;width:min(62vw,520px);height:min(46vh,450px);object-fit:contain;background:white;border-radius:24px;padding:14px}
#photoStatus{display:none;font-size:20px;opacity:.62;margin:12px 0 2px}
#brand{font-size:clamp(23px,4vw,42px);font-weight:700;margin-top:16px}
#title{font-size:clamp(30px,5vw,58px);font-weight:850;line-height:1.08;max-width:900px}
#upc{font-size:17px;opacity:.5;margin-top:12px}
#hint{font-size:20px;opacity:.65;margin-top:20px}
#teach{display:none;margin-top:22px;padding:16px 24px;border:0;border-radius:18px;font-size:24px;font-weight:750;background:#fff;box-shadow:0 3px 14px #0002}
#panel{display:none;position:fixed;inset:0;background:#f7f7f5;padding:30px;z-index:5}
#panel .box{max-width:650px;margin:auto;text-align:left}
label{display:block;font-size:20px;font-weight:700;margin:18px 0 7px}
input{width:100%;font-size:24px;padding:14px;border:1px solid #bbb;border-radius:12px}
.actions{display:flex;gap:12px;margin-top:24px}
.actions button{font-size:21px;padding:14px 20px;border-radius:12px;border:1px solid #aaa;background:white}
#save{font-weight:800}
</style>
</head>
<body tabindex="0">
<main>
<div id="status">READY — SCAN SOMETHING</div>
<img id="picture" alt="">
<div id="photoStatus"></div>
<div id="brand"></div><div id="title"></div><div id="upc"></div>
<div id="hint">Scan another item anytime.</div>
<button id="teach">Teach Me This Item</button>
</main>

<div id="panel">
 <div class="box">
  <h1>Teach Me This Item</h1>
  <div id="teachUpc"></div>
  <label for="name">Simple product name</label>
  <input id="name" placeholder="Dawn Powerwash Dish Spray">
  <label for="imageUrl">Picture URL (optional)</label>
  <input id="imageUrl" placeholder="https://…">
  <div class="actions"><button id="save">Save Item</button><button id="cancel">Cancel</button></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const statusEl=$('status'),pic=$('picture'),photoStatus=$('photoStatus'),
brandEl=$('brand'),titleEl=$('title'),upcEl=$('upc'),teachBtn=$('teach'),
panel=$('panel'),nameInput=$('name'),imageInput=$('imageUrl'),teachUpc=$('teachUpc');

let buffer='',lastKey=0,currentUPC='',scanToken=0;

const BUILT_INS={
 "030772117477":{title:"Dawn Powerwash Dish Spray",brand:"Dawn",image:""}
};

function readJSON(key){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return{}}}
function saved(){return readJSON('myProducts')}
function cache(){return readJSON('productCache')}
function getLocal(upc){return saved()[upc]||BUILT_INS[upc]||null}
function getCached(upc){return cache()[upc]||null}
function saveCache(upc,item){
  if(!item)return;
  let db=cache(); db[upc]=item;
  try{localStorage.setItem('productCache',JSON.stringify(db))}catch(e){}
}
function speak(t){
 if(!t||!('speechSynthesis'in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u);
}
function clearVisual(){
 pic.removeAttribute('src');pic.style.display='none';
 photoStatus.style.display='none';photoStatus.textContent='';
 teachBtn.style.display='none';
}
function loadPicture(url,token){
 if(!url || token!==scanToken){photoStatus.style.display='none';return}
 photoStatus.textContent='Getting your picture…';
 photoStatus.style.display='block';
 const test=new Image();
 test.onload=()=>{
   if(token!==scanToken)return;
   pic.src=url;pic.style.display='block';photoStatus.style.display='none';
 };
 test.onerror=()=>{if(token===scanToken)photoStatus.style.display='none'};
 test.src=url;
}
function present(item,upc,token,showPhoto=true){
 if(token!==scanToken)return;
 statusEl.textContent='YOU FOUND:';
 brandEl.textContent=item.brand||'';
 titleEl.textContent=item.title||'Product found';
 upcEl.textContent='UPC '+upc;
 teachBtn.style.display='none';
 // Name and speech happen BEFORE waiting on any image.
 speak([item.brand,item.title].filter(Boolean).join(' '));
 if(showPhoto)loadPicture(item.image||'',token);
}
async function off(upc){
 const url='https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(upc)+'.json?fields=product_name,product_name_en,generic_name,brands,image_front_url,image_url';
 let r=await fetch(url,{cache:'force-cache'}); if(!r.ok)return null;
 let d=await r.json();if(d.status!==1)return null;let p=d.product||{};
 let title=p.product_name||p.product_name_en||p.generic_name||'',brand=p.brands||'',image=p.image_front_url||p.image_url||'';
 return(title||brand)?{title,brand,image}:null;
}
async function upcdb(upc){
 let r=await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc='+encodeURIComponent(upc),{cache:'force-cache'});
 if(!r.ok)return null;let d=await r.json(),i=d.items&&d.items[0];if(!i)return null;
 return{title:i.title||'',brand:i.brand||'',image:(i.images&&i.images[0])||''};
}
async function lookup(upc){
 const token=++scanToken; currentUPC=upc;
 clearVisual();
 statusEl.textContent='LOOKING IT UP…';brandEl.textContent='';titleEl.textContent='';upcEl.textContent='UPC '+upc;

 // 1. User-taught items are instant.
 let local=getLocal(upc);
 if(local){present(local,upc,token,true);return}

 // 2. Previously seen products are instant too.
 let old=getCached(upc);
 if(old){
   present(old,upc,token,true);
   return;
 }

 // 3. Ask Open Food Facts first. As soon as it knows the product,
 //    show/speak the name. Do NOT wait for the second database.
 let a=null;
 try{a=await off(upc)}catch(e){}
 if(token!==scanToken)return;

 if(a){
   present(a,upc,token,true);
   saveCache(upc,a);

   // Only use the broader UPC service if OFF did not supply a picture.
   if(!a.image){
     let b=null;try{b=await upcdb(upc)}catch(e){}
     if(token!==scanToken)return;
     if(b){
       let merged={title:a.title||b.title,brand:a.brand||b.brand,image:b.image||''};
       saveCache(upc,merged);
       if(merged.image)loadPicture(merged.image,token);
     }
   }
   return;
 }

 // 4. Food database missed it; now try broader UPC database.
 let b=null;try{b=await upcdb(upc)}catch(e){}
 if(token!==scanToken)return;
 if(b){
   saveCache(upc,b);present(b,upc,token,true);return;
 }

 statusEl.textContent="I DON'T KNOW THIS ONE YET!";
 brandEl.textContent='';titleEl.textContent='';photoStatus.style.display='none';
 teachBtn.style.display='inline-block';
 speak("I don't know this one yet");
}

window.addEventListener('keydown',e=>{
 if(panel.style.display==='block')return;
 let now=Date.now();if(now-lastKey>500)buffer='';lastKey=now;
 if(/^\d$/.test(e.key)){e.preventDefault();buffer+=e.key;return}
 if(e.key==='Enter'){e.preventDefault();let upc=buffer.replace(/\D/g,'');buffer='';if(upc)lookup(upc)}
},true);

teachBtn.onclick=()=>{
 teachUpc.textContent='UPC '+currentUPC;nameInput.value='';imageInput.value='';
 panel.style.display='block';nameInput.focus();
}
$('cancel').onclick=()=>{panel.style.display='none';document.body.focus()}
$('save').onclick=()=>{
 let title=nameInput.value.trim();if(!title)return;
 let db=saved();db[currentUPC]={title,brand:'',image:imageInput.value.trim()};
 localStorage.setItem('myProducts',JSON.stringify(db));
 panel.style.display='none';
 const token=++scanToken;clearVisual();present(db[currentUPC],currentUPC,token,true);
 document.body.focus();
}
window.addEventListener('load',()=>document.body.focus());
</script>
</body></html>
